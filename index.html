info:[
['What is S I E Member?',`<p>A free trading bot for members under S I E Partner. You do not need to run the bot yourself. It starts working once your details pass verification, and its trades go into your Deriv account through a PAT token with the trade scope.</p><p>Just follow performance and bot status on the S I E dashboard, or check Open positions and trade history in your Deriv account.</p><p>There are three independent bots: Starter, Advanced and Expert. Each has its own capital range, target and loss limit. See Series summary.</p><p>Your funds stay in your account. S I E cannot withdraw or move your money.</p>`,1],
['How it works',`<ol>${li(['Open a Deriv account with the Open Account button above.','Verify your identity and address.','Create an App ID and a PAT token (trade scope only).','Choose a series that fits your budget, complete verification and save your member code.','Wait for approval. Your status moves from Pending to Approved to Live.','Once Live, the bot works automatically. Follow it on the S I E dashboard or in Deriv Open positions.'])}</ol>`],
['What to prepare',`<ul>${li(['An email address you can access.','A valid ID card, driving licence or passport.','Proof of address dated within the last 3 months (utility bill, bank statement or government letter).','A phone or webcam for the selfie check.'])}</ul>`],
['Status meanings','{S}'],
['Common questions',`{Q}`]],
faq:[
['Is it really free?','Yes. It is free for members under S I E Partner.'],
['Why was I not approved?','Your account was not found under S I E Partner. Make sure you opened it with the Open Account button on this page.'],
['How do I stop the bot?','Enter your member code under Status and stop, then press Stop my bot. No new entries are placed, open trades settle, then the bot stops. You can also revoke the token in Deriv at any time and the bot stops right away.'],
['I lost my member code.','The code is saved in this browser and filled in automatically. Keep a copy in your notes as well.'],
['I cannot create a Deriv account.','Common reasons: you are under 18, you already have a Deriv account, or Deriv is not available in your country of residence.'],
['Is there any risk?','Yes. Trading can lose money and no profit is guaranteed.']],
steps:[
['Open the link and click Open Account',`<p>Use this button so your account is registered under S I E Partner.</p>${BTN}`,1],
['Enter and verify your email',`<p>Enter an email you can access. You will use it to log in and to receive important notices.</p><p>Deriv sends a verification email. Click the link or enter the code it contains. If nothing arrives, check your spam folder and ask for a new one.</p>`],
['Choose country, citizenship and password',`<p>Select your country of residence and citizenship exactly as on your ID. Then create a strong password.</p>`],
['Your demo account is ready',`<p>Once your email is verified, a demo account is active right away. You can try the platform with virtual funds.</p>`],
['Create your real account',`<p>Click <b>Complete my profile</b>. Choose your account currency, fill in your personal and address details, then accept the terms of use.</p><div class="tip">Enter details exactly as they appear on your documents.</div>`],
['Verify your identity and address',`<ol>
<li><b>Start.</b> Select your country of residence and acknowledge the Privacy Notice.</li>
<li><b>Liveness check.</b> Follow the on-screen instructions to take a selfie. Keep your face clear, well lit and centred.</li>
<li><b>Identity document.</b> Select the issuing country and document type, then upload a clear photo or scan. Accepted: official ID card, driving licence or a valid passport. All corners and text must be visible, with no glare or shadows.</li>
<li><b>Address.</b> Choose one option:
<ul><li>Enable GPS on your phone and your address is confirmed automatically.</li><li>Upload a proof of address. Confirm your full address (it must match the document), then upload a JPG, PNG, WEBP or PDF up to 50 MB. Accepted: valid ID showing your address, utility bill (electricity, water, gas), bank statement or government letter. It must be dated within the last 3 months.</li></ul></li>
<li><b>Terms.</b> Accept the terms of use and the FATCA declaration, and confirm whether you are a politically exposed person (PEP).</li></ol>`],
['Wait for the result',`<p>Deriv emails you when verification is complete. If approved, you can fund your account and start trading right away.</p><div class="tip">Documents declined? Check that all corners are visible, there is no glare, your details match your profile and the address document is under 3 months old. More help: ${lk(HC+'why-were-my-documents-declined','why were my documents declined')}.</div>`],
['Make sure your real (CR) account is active',`<p>The bot works on a real trading account (CR). To check or add one: open the account switcher next to your balance, tap <b>Add or manage account</b>, choose the <b>Fiat currencies</b> tab, then pick a currency.</p>`],
['Continue with your token',`<p>Your account is ready. Now create the App ID and the PAT, then paste them into the Register form:</p><ol>{HOW}</ol><div class="tip">Select the trade scope only. Never add payment.</div><button class="btn" type="button" onclick="go('dV')">Open the Register form</button><p>${lk('https://developers.deriv.com/docs/account-setup','Deriv developer guide')}</p>`]],

info:[
['Apa itu S I E Member?',`<p>Bot trading gratis untuk member di bawah S I E Partner. Anda tidak perlu menjalankan bot sendiri. Bot mulai bekerja setelah data Anda lolos verifikasi, dan transaksinya masuk ke akun Deriv Anda melalui token PAT dengan scope trade.</p><p>Cukup pantau performa dan status bot di dashboard S I E, atau lihat Open positions dan riwayat transaksi di akun Deriv Anda.</p><p>Ada tiga bot mandiri: Starter, Advanced, dan Expert. Masing-masing punya rentang modal, target, dan batas rugi sendiri. Lihat Ringkasan seri.</p><p>Dana tetap di akun Anda. S I E tidak bisa menarik atau memindahkan uang.</p>`,1],
['Cara kerja',`<ol>${li(['Buka akun Deriv lewat tombol Open Account di atas.','Verifikasi identitas dan alamat Anda.','Buat App ID dan token PAT (scope trade saja).','Pilih seri sesuai budget, lengkapi verifikasi, lalu simpan kode member.','Tunggu persetujuan. Status berjalan dari Menunggu, Disetujui, lalu Live.','Setelah Live, bot bekerja otomatis. Pantau di dashboard S I E atau Open positions Deriv.'])}</ol>`],
['Yang perlu disiapkan',`<ul>${li(['Email aktif yang bisa Anda akses.','KTP atau kartu identitas resmi, SIM, atau paspor yang masih berlaku.','Bukti alamat maksimal 3 bulan terakhir (tagihan listrik/air/gas, rekening koran, atau surat resmi pemerintah).','HP atau webcam untuk selfie.'])}</ul>`],

faq:[
['Apakah benar-benar gratis?','Ya. Gratis untuk member di bawah S I E Partner.'],
['Kenapa status saya Tidak disetujui?','Akun Anda tidak ditemukan di bawah S I E Partner. Pastikan akun dibuat lewat tombol Open Account di halaman ini.'],
['Bagaimana menghentikan bot?','Isi kode member di bagian Status dan stop, lalu tekan Stop bot saya. Tidak ada entry baru, trade yang terbuka settle dulu, lalu bot berhenti. Anda juga bisa mencabut token di Deriv kapan saja, bot langsung berhenti.'],
['Kode member saya hilang.','Kode tersimpan di browser ini dan terisi otomatis. Simpan juga salinannya di catatan Anda.'],
['Saya tidak bisa membuat akun Deriv.','Penyebab umum: usia di bawah 18 tahun, sudah punya akun Deriv, atau Deriv belum tersedia di negara tempat tinggal Anda.'],

steps:[
['Buka link dan klik Open Account',`<p>Gunakan tombol ini agar akun Anda terdaftar di bawah S I E Partner.</p>${BTN}`,1],
['Isi dan verifikasi email',`<p>Isi email aktif yang bisa Anda akses. Email ini dipakai untuk login dan menerima pemberitahuan penting.</p><p>Deriv mengirim email verifikasi. Klik tautannya atau masukkan kode di dalamnya. Jika belum masuk, cek folder spam lalu minta kirim ulang.</p>`],
['Pilih negara, kewarganegaraan dan password',`<p>Pilih negara tempat tinggal dan kewarganegaraan sesuai identitas Anda. Lalu buat password yang kuat.</p>`],
['Akun demo siap dipakai',`<p>Setelah email terverifikasi, akun demo langsung aktif. Anda bisa mencoba platform dengan dana virtual.</p>`],
['Buat akun real',`<p>Klik <b>Complete my profile</b>. Pilih mata uang akun, isi data pribadi dan alamat, lalu setujui syarat penggunaan.</p><div class="tip">Isi data persis seperti di dokumen Anda.</div>`],
['Verifikasi identitas dan alamat',`<ol>
<li><b>Mulai.</b> Pilih negara tempat tinggal dan setujui Privacy Notice.</li>
<li><b>Cek liveness.</b> Ikuti petunjuk di layar untuk selfie. Wajah harus jelas, terang dan di tengah.</li>
<li><b>Dokumen identitas.</b> Pilih negara penerbit dan jenis dokumen, lalu unggah foto atau scan yang jelas. Diterima: kartu identitas resmi, SIM, atau paspor yang berlaku. Semua sudut dan teks harus terlihat, tanpa silau atau bayangan.</li>
<li><b>Alamat.</b> Pilih salah satu:
<ul><li>Aktifkan GPS di HP, alamat terverifikasi otomatis.</li><li>Unggah bukti alamat. Konfirmasi alamat lengkap (harus sama dengan dokumen), lalu unggah JPG, PNG, WEBP atau PDF maksimal 50 MB. Diterima: ID yang memuat alamat, tagihan (listrik, air, gas), rekening koran, atau surat resmi pemerintah. Tanggalnya maksimal 3 bulan terakhir.</li></ul></li>
<li><b>Syarat.</b> Setujui syarat penggunaan dan deklarasi FATCA, lalu nyatakan apakah Anda seorang politically exposed person (PEP).</li></ol>`],
['Tunggu hasil verifikasi',`<p>Deriv mengirim email saat verifikasi selesai. Jika disetujui, Anda bisa langsung mengisi dana dan mulai trading.</p><div class="tip">Dokumen ditolak? Pastikan semua sudut terlihat, tidak ada silau, data sama dengan profil, dan dokumen alamat belum lewat 3 bulan. Bantuan lain: ${lk(HC+'why-were-my-documents-declined','kenapa dokumen saya ditolak')}.</div>`],
['Pastikan akun real (CR) aktif',`<p>Bot bekerja di akun trading real (CR). Untuk cek atau menambah: buka pengalih akun di sebelah saldo, ketuk <b>Add or manage account</b>, pilih tab <b>Fiat currencies</b>, lalu pilih mata uang.</p>`],
['Lanjut ke token',`<p>Akun sudah siap. Sekarang buat App ID dan PAT, lalu tempel di formulir Daftar:</p><ol>{HOW}</ol><div class="tip">Pilih scope trade saja. Jangan tambahkan payment.</div><button class="btn" type="button" onclick="go('dV')">Buka formulir Daftar</button><p>${lk('https://developers.deriv.com/docs/account-setup','Panduan developer Deriv')}</p>`]],

+c.steps.map((x,i)=>acc(x[0],x[1].replace('{HOW}',H),x[2],i+1)).join('')+'<div class="src">'+c.src+'</div>';
if(q.length)document.querySelectorAll('#ringkas details,#info details,#tut details').forEach((d,i)=>{if(i<q.length)d.open=q[i]})}
const HS={dV:'verifikasi',dT:'tutorial'},BT={dV:'iv',dT:'it'};

try{history.replaceState(null,'',v=='home'?location.pathname+location.search:'#'+HS[v])}catch(e){}

let AN=true;

const t0=performance.now(),DUR=900;document.querySelectorAll('#mem .cnt').forEach(b=>{const v=+b.dataset.v;(function f(t){const k=Math.min(1,Math.max(0,(t-t0)/DUR));b.textContent=nf(Math.round(v*(1-Math.pow(1-k,3))),0);if(k<1)requestAnimationFrame(f)})(t0)});el.querySelectorAll('.pl').forEach((b,i)=>{const v=+b.dataset.v,d=i*120;(function f(t){const k=Math.min(1,Math.max(0,(t-t0-d)/DUR)),e=1-Math.pow(1-k,3);b.textContent=pf(v*e);if(k<1)requestAnimationFrame(f)})(t0)})}
function tgAll(o){document.querySelectorAll('#tut>details').forEach(d=>d.open=o)}
async function loadPerf(){try{const r=await fetch('performance.json?t='+Date.now());if(!r.ok)throw 0;P=await r.json()}catch(e){P=DEMO}dash()}
const $=id=>document.getElementById(id);let L=(navigator.language||'en').toLowerCase().startsWith('id')?'id':'en';
const cm=a=>{const o=$('com');o.textContent='';a.forEach((x,i)=>{const r=document.createElement('div'),n=document.createElement('i'),d=document.createElement('div'),b=document.createElement('b'),t=document.createElement('span');r.className='r';n.textContent=String(i+1).padStart(2,'0');b.textContent=x[0];t.textContent=x[1];d.append(b,t);r.append(n,d);o.append(r)})};
function ui(){const t=T[L];document.documentElement.lang=L;$('lg').textContent=L=='en'?'ID':'EN';$('lg').setAttribute('aria-label',L=='en'?'Ganti ke Bahasa Indonesia':'Switch to English');$('sub').textContent=t.sub;$('hCom').textContent=t.hCom;

$('hReg').textContent=t.hReg;$('lT').textContent=t.lT;$('lS').textContent=t.lS;$('lA').textContent=t.lA;$('tAg').textContent=t.tAg;$('go').textContent=t.go;$('hSt').textContent=t.hSt;$('lC').textContent=t.lC;$('bC').textContent=t.bC;$('bS').textContent=t.bS;$('hP').textContent=D[L].hP;$('hJ').textContent=C[L].hV;$('hI').textContent=C[L].hI;$('hR').textContent=C[L].hR;$('hT').textContent=C[L].hT;$('iv').textContent=C[L].bv;document.querySelectorAll('.cx').forEach(b=>b.textContent=C[L].cl);$('it').textContent=C[L].bt;rnd();dash()}

const msg=(id,x,c)=>{const e=$(id);e.className='m '+(c||'');e.textContent=x};
function mk(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(12));return[...r].map(x=>a[x%32]).join('')}
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const API='https://api.derivws.com';
async function auth(tok,app){const H={'Authorization':'Bearer '+tok,'Deriv-App-ID':app},get=async p=>{const c=new AbortController(),m=setTimeout(()=>c.abort(),12000);try{return await fetch(API+p,{headers:H,signal:c.signal})}finally{clearTimeout(m)}};
let r;try{r=await get('/trading/v1/options/accounts')}catch(e){return{unv:true,loginid:'-'}}
if(!r.ok){let m='HTTP '+r.status;try{const j=await r.json();if(j.errors&&j.errors[0]&&j.errors[0].message)m+=' - '+j.errors[0].message}catch(e){}throw new Error(m)}
let j={};try{j=await r.json()}catch(e){}
const arr=Array.isArray(j)?j:Array.isArray(j.data)?j.data:(j.data&&Array.isArray(j.data.accounts)?j.data.accounts:[]),ids=arr.map(x=>x&&(x.account_id||x.loginid||x.id)).filter(Boolean).join(',')||'-';
let pay=false;try{pay=(await get('/wallet/v1/wallets')).ok}catch(e){}
return{loginid:ids,pay}}
function send(o){const b=new URLSearchParams();for(const k in E)b.append('entry.'+E[k],o[k]||'-');return fetch(FORM,{method:'POST',mode:'no-cors',body:b})}
async function reg(){const t=T[L],tok=$('tok').value.trim(),app=$('app').value.trim();if(!tok||!app||!$('ag').checked)return msg('rm',t.need,'no');
const ser=(document.querySelector('input[name=ser]:checked')||{}).value;if(!ser)return msg('rm',t.sv,'no');
if(!/^[A-Za-z0-9]{1,32}$/.test(app))return msg('rm',t.badapp,'no');if(/\s/.test(tok)||tok.length<8||tok.length>256)return msg('rm',t.badtok,'no');
$('go').disabled=true;msg('rm',t.chk1);
try{const a=await auth(tok,app);
if(a.pay){msg('rm',t.scope,'no');return}
let code='';try{code=localStorage.getItem('sie_member_code')||''}catch(e){}if(!code){code=mk();try{localStorage.setItem('sie_member_code',code)}catch(e){}}
const k=await crypto.subtle.importKey('jwk',PUB,{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);
const enc=btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.encrypt({name:'RSA-OAEP'},k,new TextEncoder().encode(tok)))));
try{await send({type:'REGISTER',login:a.loginid,app:app,path:ser,lang:L,tok:enc,code})}catch(e){return msg('rm',t.fail,'no')}
$('tok').value='';$('code').value=code;msg('rm',t.done+' '+code,'ok');const d=document.createElement('div');d.className='cd';d.textContent=code;$('rm').append(d);if(a.unv){const n=document.createElement('div');n.textContent=t.unv;n.style.marginTop='8px';$('rm').append(n)}}
catch(e){msg('rm',t.bad+(e.message||e),'no')}finally{$('go').disabled=false}}
async function chk(){const t=T[L],c=$('code').value.trim().toUpperCase();if(!c)return msg('sm',t.nocode,'no');if(!STATUS_CSV)return msg('sm',t.nocsv);
try{const h=await sha(c),r=await fetch(STATUS_CSV+(STATUS_CSV.includes('?')?'&':'?')+'t='+Date.now()),l=(await r.text()).split(/\r?\n/).find(x=>x.trim().startsWith(h+','));
if(!l)return msg('sm',t.nf);const s=l.split(',')[1].trim().toUpperCase();msg('sm',t.S[s]||s,s=='REJECT'||s=='REVOKED'?'no':s=='LIVE'||s=='ACCEPT'?'ok':'')}catch(e){msg('sm',t.nocsv)}}
async function stp(){const t=T[L],c=$('code').value.trim().toUpperCase();if(!c)return msg('sm',t.nocode,'no');if(!confirm(t.cf))return;
try{await send({type:'STOP',code:c,lang:L});msg('sm',t.sent,'ok')}catch(e){msg('sm',t.fail,'no')}}
try{const c=localStorage.getItem('sie_member_code');if(c)$('code').value=c}catch(e){}ui();
loadPerf();
{const v={'#verifikasi':'dV','#tutorial':'dT'}[location.hash];if(v)show(v)}
