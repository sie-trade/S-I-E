<svg xmlns="http://www.w3.org/2000/svg" width="400" height="374" viewBox="0 0 400 374" role="img" aria-label="Pilihan seri. Starter: modal $7 – tanpa batas, target +100% dari modal awal, batas rugi hingga 100% modal. Advanced: modal $500 – $4.000, target +5% dari modal awal, batas rugi maks. 50% modal. Expert: modal $5.000 – $10.000, target +5% dari modal awal, batas rugi maks. 25% modal." font-family="Inter,-apple-system,Segoe UI,Roboto,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><style>
.in{animation:in .6s cubic-bezier(.2,.7,.2,1) both}
