<svg xmlns="http://www.w3.org/2000/svg" width="140" height="40" viewBox="0 0 140 40" role="img" aria-label="Open Account" font-family="Inter,-apple-system,Segoe UI,Roboto,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><style>
.in{animation:in .6s cubic-bezier(.2,.7,.2,1) both}
.bar{transform-box:fill-box;transform-origin:top;animation:bar .8s .2s ease-out both}
.line{transform-box:fill-box;transform-origin:center;animation:line 1s .3s ease-out both}
.dot{animation:dot 2.4s ease-in-out infinite}
@keyframes in{from{transform:translateY(6px)}}
@keyframes bar{from{transform:scaleY(.3)}}
@keyframes line{from{transform:scaleX(.3)}}
@keyframes dot{50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x=".5" y=".5" width="139" height="39" rx="11" fill="#a32531" stroke="#c4505a"/><text x="70" y="25" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Open Account →</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>