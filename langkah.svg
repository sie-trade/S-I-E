<svg xmlns="http://www.w3.org/2000/svg" width="400" height="310" viewBox="0 0 400 310" role="img" aria-label="Cara bergabung: 1. Buka akun Deriv, Lewat tombol Open Account. 2. Buat token API, Scope trade saja, tanpa payment. 3. Isi form Verifikasi, Pilih seri, simpan kode member. 4. Tunggu verifikasi, Menunggu → disetujui → live. 5. Pantau performa, Dashboard website dan akun Deriv" font-family="Inter,-apple-system,Segoe UI,Roboto,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><style>
.in{animation:in .6s cubic-bezier(.2,.7,.2,1) both}
.bar{transform-box:fill-box;transform-origin:top;animation:bar .8s .2s ease-out both}
.line{transform-box:fill-box;transform-origin:center;animation:line 1s .3s ease-out both}
.dot{animation:dot 2.4s ease-in-out infinite}
@keyframes in{from{transform:translateY(6px)}}
@keyframes bar{from{transform:scaleY(.3)}}
@keyframes line{from{transform:scaleX(.3)}}
@keyframes dot{50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
